# NGINX stream configuration (VPS)
# Add this to /etc/nginx/nginx.conf OUTSIDE of the http {} block
# Note: SSL is not used here because the WireGuard tunnel already encrypts traffic

stream {
    # Logging for TCP connections
    log_format stream_log '$remote_addr [$time_local] '
                          '$protocol $status $bytes_sent $bytes_received '
                          '$session_time';

    access_log /var/log/nginx/stream_access.log stream_log;
    error_log /var/log/nginx/stream_error.log;

    # Rate limiting: track connections per IP (10MB zone = ~160,000 IPs)
    limit_conn_zone $binary_remote_addr zone=postgres_conn:10m;

    # PostgreSQL upstream (via Tailscale to pyrite, 100.64.0.2)
    upstream postgresql_backend {
        server 100.64.0.2:5432;
    }

    # PostgreSQL TCP proxy
    server {
        listen 54321;
        proxy_pass postgresql_backend;
        
        # Timeout settings
        proxy_timeout 600s;           # Allow long-running queries (10 min)
        proxy_connect_timeout 30s;    # Connection establishment timeout
        
        # Buffer settings for better throughput
        proxy_buffer_size 16k;
        
        # Limit to 5 concurrent connections per IP
        # 30 students × 3 connections each = 90 max, plus buffer
        # Individual student limit prevents one person hogging resources
        limit_conn postgres_conn 5;
    }
}
