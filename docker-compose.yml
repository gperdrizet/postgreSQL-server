services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
    volumes:
      - ${PGDATA_DIR:?PGDATA_DIR must be set in .env}:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./config/ssl/server.crt:/etc/ssl/certs/server.crt:ro
      - ./config/ssl/server.key:/var/lib/postgresql/server.key:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set in .env}:5432:5432"
    networks:
      - postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring: PostgreSQL metrics exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "host=postgres port=5432 user=${DB_USER:?DB_USER must be set in .env} password=${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set in .env} dbname=postgres sslmode=require"
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set in .env}:9187:9187"
    networks:
      - postgres-net
    depends_on:
      postgres:
        condition: service_healthy

  # DB admin
  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL must be set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set in .env}
      PGADMIN_LISTEN_PORT: 80
      # Keep the declarative server list in sync (9.x) even when the config DB already exists
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set in .env}:8088:80"
    networks:
      - postgres-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  postgres-net:
    driver: bridge

# Monitoring is centralized on gatekeeper: postgres-exporter is scraped by the
# central Prometheus (job pyrite-postgres-exporter); dashboards live in the
# central Grafana (postgres-main-overview).
volumes:
  pgadmin-data:
