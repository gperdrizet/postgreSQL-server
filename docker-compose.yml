services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./config/ssl/server.crt:/etc/ssl/certs/server.crt:ro
      - ./config/ssl/server.key:/var/lib/postgresql/server.key:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "100.64.0.2:5432:5432"
    networks:
      - postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring: PostgreSQL metrics exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "host=postgres port=5432 user=admin password=${POSTGRES_ADMIN_PASSWORD} dbname=postgres sslmode=require"
    ports:
      - "100.64.0.2:9187:9187"
    networks:
      - postgres-net
    depends_on:
      postgres:
        condition: service_healthy

  # DB admin
  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pyrite.lan
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "100.64.0.2:8088:80"
    networks:
      - postgres-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  postgres-net:
    driver: bridge

# Monitoring is centralized on gatekeeper: postgres-exporter is scraped by the
# central Prometheus (job pyrite-postgres-exporter); dashboards live in the
# central Grafana (postgres-main-overview).
volumes:
  pgadmin-data:
