# PostgreSQL configuration for ~30 student connections + service accounts

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory settings (adjust based on available RAM)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB

# Write ahead log
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# Query tuning
random_page_cost = 1.1
effective_io_concurrency = 200

# Concurrency tuning for 25-30 clients
synchronous_commit = off          # Faster writes, tiny durability tradeoff (data safe on crash, may lose last few ms)
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 8

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000  # Log queries taking over 1 second

# Statement timeout (prevent runaway queries)
statement_timeout = 30000

# SSL configuration
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'

# Locale
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# ============================================
# pg_stat_statements extension for query analysis
# ============================================
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.track_planning = on
